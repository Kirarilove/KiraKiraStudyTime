<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KiraKira Study Full Version</title>
    <style>
        /* デザイン：ピンク系ですが、読みやすさを重視 */
        :root { --main-pink: #fb6f92; --soft-pink: #ffafcc; --bg-pink: #ffe5ec; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: var(--bg-pink); font-family: sans-serif; color: #555; padding: 20px; overflow-x: hidden; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; position: relative; z-index: 10; border: 1px solid #ffc2d1; }
        h1 { font-size: 1.3rem; color: var(--main-pink); margin: 5px 0 15px 0; }
        #reward { font-size: 3.2rem; font-weight: bold; color: var(--main-pink); margin: 5px 0; }
        #timer { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; font-family: monospace; }
        .config { background: #fff0f3; padding: 12px; border-radius: 15px; font-size: 0.8rem; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; justify-content: space-around; align-items: center; }
        input, select { border: 2px solid #ffc2d1; border-radius: 8px; padding: 4px; outline: none; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 10px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; background: var(--main-pink); color: white; transition: 0.2s; }
        button:disabled { background: #eee !important; color: #ccc !important; }
        #startBtn { grid-column: span 2; background: #ffb3c6; }
        .calc-box { border: 2px dashed var(--main-pink); border-radius: 15px; padding: 10px; background: white; }
        .wish-box { text-align: left; background: white; border: 1px solid #ffc2d1; border-radius: 12px; padding: 10px; max-height: 100px; overflow-y: auto; margin: 10px 0; font-size: 0.75rem; }
        .wish-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding: 4px 0; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 300px; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 0 50px rgba(0,0,0,0.2); text-align: center; z-index: 1000; border: 2px solid var(--main-pink); }
        /* エフェクト用 */
        .star { position: absolute; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>

<div class="card">
    <h1>✨ KiraKira Study Time</h1>
    <div class="config">
        <div class="row">時給: <input type="number" id="rate" value="1000" style="width:50px;">円 科目: <select id="sub"></select></div>
        <div class="row"><input type="text" id="addS" placeholder="追加科目" style="width:100px;"><button onclick="newS()" style="padding:4px 8px; font-size:0.7rem;">追加</button></div>
    </div>
    <div id="reward">¥0</div>
    <div id="timer">00:00:00</div>
    <div class="btns">
        <button id="startBtn" onclick="stT()">Start Study</button>
        <button id="pauseBtn" onclick="paT()" disabled>休憩</button>
        <button id="stopBtn" onclick="soT()" disabled>終了</button>
    </div>
</div>

<div class="card">
    <div class="calc-box">
        <div style="color:var(--main-pink); font-weight:bold; font-size:0.8rem;">💰 お給料計算</div>
        <div style="font-size:0.7rem; margin:5px 0;"><input type="date" id="d1"> 〜 <input type="date" id="d2"> <button onclick="calc()" style="padding:4px 8px; font-size:0.7rem;">計算</button></div>
        <div id="res" style="font-size:1.3rem; font-weight:bold; color:var(--main-pink);">¥0</div>
    </div>
</div>

<div class="card">
    <div style="font-weight:bold; color:var(--main-pink); font-size:0.8rem;">🎁 Wish List</div>
    <div id="wL" class="wish-box"></div>
    <div style="display:flex; gap:3px;">
        <input type="text" id="wN" placeholder="ご褒美" style="flex:1; font-size:0.7rem;">
        <input type="number" id="wP" placeholder="円" style="width:50px; font-size:0.7rem;">
        <button onclick="addW()" style="padding:4px 8px; font-size:0.7rem;">追加</button>
    </div>
</div>

<div class="card" style="font-size:0.6rem; color:#aaa;">背景: <input type="file" accept="image/*" onchange="bg(this)"></div>

<div id="modal">
    <div style="font-size: 2rem;">🌸</div>
    <div id="msg" style="margin: 15px 0; color: var(--main-pink); font-weight: bold; font-size: 0.9rem;"></div>
    <button onclick="document.getElementById('modal').style.display='none'" style="padding:10px 20px; border-radius:20px;">OK!</button>
</div>

<script>
    let sTime, eTime = 0, tInt, isR = false, isP = false;
    let wishes = JSON.parse(localStorage.getItem('kk_w') || '[]');
    let subs = JSON.parse(localStorage.getItem('kk_s') || '["国語","数学","英語"]');

    window.onload = () => {
        renderS(); renderW();
        const b = localStorage.getItem('kk_b');
        if(b) document.body.style.backgroundImage = `url(${b})`;
    };

    // --- ✨ キラキラエフェクトのロジック ✨ ---
    function createStar(x, y) {
        const s = document.createElement('div');
        s.className = 'star';
        s.innerHTML = ['✨', '🌸', '💖', '⭐'][Math.floor(Math.random() * 4)];
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.fontSize = (Math.random() * 15 + 10) + 'px';
        document.body.appendChild(s);

        s.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: `translate(${(Math.random()-0.5)*100}px, -100px) scale(0)`, opacity: 0 }
        ], { duration: 800 }).onfinish = () => s.remove();
    }

    // マウス移動・クリック・タップすべてに対応
    document.addEventListener('mousemove', (e) => { if(Math.random() > 0.9) createStar(e.pageX, e.pageY); });
    document.addEventListener('mousedown', (e) => { for(let i=0; i<5; i++) createStar(e.pageX, e.pageY); });
    document.addEventListener('touchstart', (e) => { for(let i=0; i<5; i++) createStar(e.touches[0].pageX, e.touches[0].pageY); });

    // --- 各種機能 ---
    function bg(el) { const r = new FileReader(); r.onload = (e) => { document.body.style.backgroundImage = `url(${e.target.result})`; localStorage.setItem('kk_b', e.target.result); }; r.readAsDataURL(el.files[0]); }
    function newS() { const v = document.getElementById('addS').value; if(v){ subs.push(v); localStorage.setItem('kk_s', JSON.stringify(subs)); renderS(); document.getElementById('addS').value=''; } }
    function renderS() { const s = document.getElementById('sub'); s.innerHTML = ''; subs.forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; s.appendChild(o); }); }
    function addW() { const n = document.getElementById('wN').value, p = parseInt(document.getElementById('wP').value); if(n && p){ wishes.push({n,p}); localStorage.setItem('kk_w', JSON.stringify(wishes)); renderW(); document.getElementById('wN').value=''; document.getElementById('wP').value=''; } }
    function renderW() { document.getElementById('wL').innerHTML = wishes.map((w,i) => `<div class="wish-item"><span>${w.n}</span><span>¥${w.p.toLocaleString()} <button onclick="delW(${i})" style="background:none;color:#ccc;border:none;">×</button></span></div>`).join(''); }
    function delW(i) { wishes.splice(i,1); localStorage.setItem('kk_w', JSON.stringify(wishes)); renderW(); }

    function stT() { isR = true; sTime = Date.now() - eTime; tInt = setInterval(upd, 100); btn(true); }
    function paT() { if(!isP){ clearInterval(tInt); isP = true; document.getElementById('pauseBtn').textContent="再開"; } else { sTime = Date.now() - eTime; tInt = setInterval(upd, 100); isP = false; document.getElementById('pauseBtn').textContent="休憩"; } }
    function upd() { if(isR && !isP) eTime = Date.now() - sTime; const s = Math.floor(eTime/1000); document.getElementById('timer').textContent = `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; document.getElementById('reward').textContent = `¥${Math.floor(parseInt(document.getElementById('rate').value) * (eTime/3600000)).toLocaleString()}`; }
    
    function soT() {
        clearInterval(tInt); const rate = parseInt(document.getElementById('rate').value); const earned = Math.floor(rate * (eTime/3600000));
        let h = JSON.parse(localStorage.getItem('kk_h') || '[]'); h.push({r: earned, d: new Date().toISOString()}); localStorage.setItem('kk_h', JSON.stringify(h));
        const total = h.reduce((s, i) => s + i.r, 0);
        let msg = `獲得: ¥${earned.toLocaleString()}<br>累計: ¥${total.toLocaleString()}<br><br>`;
        const can = wishes.filter(w => w.p <= total);
        if(can.length) msg += `「${can[can.length-1].n}」が買えるよ💖`;
        document.getElementById('msg').innerHTML = msg; document.getElementById('modal').style.display='block';
        eTime = 0; isR = false; upd(); btn(false);
    }

    function calc() {
        const v1 = document.getElementById('d1').value, v2 = document.getElementById('d2').value;
        if(!v1 || !v2) return;
        const d1 = new Date(v1), d2 = new Date(v2); d2.setHours(23,59,59);
        const h = JSON.parse(localStorage.getItem('kk_h') || '[]');
        let sum = h.filter(i => { const d = new Date(i.d); return d >= d1 && d <= d2; }).reduce((s, i) => s + i.r, 0);
        document.getElementById('res').textContent = `¥${sum.toLocaleString()}`;
    }

    function btn(on) { document.getElementById('startBtn').disabled=on; document.getElementById('pauseBtn').disabled=!on; document.getElementById('stopBtn').disabled=!on; }
</script>
</body>
</html>
